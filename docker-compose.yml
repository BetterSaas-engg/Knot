services:
  db:
    image: postgres:17-alpine
    container_name: knot-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: knot
      POSTGRES_PASSWORD: knot_dev_password
      POSTGRES_DB: knot
    volumes:
      - knot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knot -d knot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  knot_postgres_data:
